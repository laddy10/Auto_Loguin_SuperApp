// ============================================================================
// Login Mi Claro APP — stack moderno (nov-2026)
//
//   Java 17 · Gradle 8.14 · Serenity 5.4 · Cucumber 8 + JUnit Platform
//   Selenium 4.52 · Appium java-client 10 · servidor Appium 3 (uiautomator2)
//
// Gradle tiene que correr con Java 17: el informe agregado de Serenity se genera
// dentro del proceso de Gradle y Serenity 5 está compilado para Java 17.
//   · Orquestador: projects.json > execution > env > JAVA_HOME
//   · Local:       JAVA_HOME=C:\Java\jdk-17 (IntelliJ: Settings > Gradle > Gradle JVM)
// ============================================================================

plugins {
    id 'java'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.4.2'
}

if (JavaVersion.current() < JavaVersion.VERSION_17) {
    throw new GradleException(
            "Este proyecto necesita Java 17 y Gradle está corriendo con Java ${JavaVersion.current()}. " +
            "Usa JAVA_HOME=C:\\Java\\jdk-17 (o, en IntelliJ, Gradle JVM = 17).")
}

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

ext {
    serenityVersion = '5.4.2'
    cucumberVersion = '8.0.4'
    junitVersion    = '6.1.3'
    appiumVersion   = '10.1.1'   // el que trae Serenity 5.4.2 (Selenium 4.52)
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "io.appium:java-client:${appiumVersion}"

    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitVersion}"
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher:${junitVersion}"

    // Informe Word (WordAppium)
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Salida de consola de Serenity
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

// ─── Tag a ejecutar ─────────────────────────────────────────────────────────
// Cucumber 8 ignora -Dcucumber.options. Se aceptan las dos formas:
//   gradlew test -Pcucumber.tags="@LOGIN_COMPLETO"            (la de Ecommerce)
//   gradlew test -Dcucumber.options="--tags @LOGIN_COMPLETO"  (la que manda hoy el orquestador)
def tagDeEjecucion() {
    def tags = project.findProperty('cucumber.tags')
    if (tags) {
        return tags.toString()
    }
    def opciones = System.getProperty('cucumber.options')
    if (opciones) {
        def m = (opciones =~ /--tags\s+(?:"([^"]+)"|'([^']+)'|(\S+))/)
        if (m.find()) {
            return m.group(1) ?: m.group(2) ?: m.group(3)
        }
    }
    return '@LOGIN_COMPLETO'
}

// Propiedades que el orquestador pasa con -D y deben llegar a la JVM de la prueba.
def PREFIJOS_REENVIADOS = ['appium.', 'serenity.', 'webdriver.', 'device.', 'st.', 'adb.',
                           'whatsapp.', 'cucumber.']

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    maxParallelForks = 1

    def tag = tagDeEjecucion()
    systemProperty 'cucumber.filter.tags', tag
    System.properties.each { k, v ->
        def clave = k.toString()
        if (clave != 'cucumber.options' && PREFIJOS_REENVIADOS.any { clave.startsWith(it) }) {
            systemProperty clave, v
        }
    }
    systemProperty 'file.encoding', 'UTF-8'

    testLogging {
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        showStandardStreams = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }

    doFirst {
        println "Tag: ${tag}"
    }
}

// src/test/resources/app/mi-claro.apk (si existe) no se copia a build/: tardaba ~1 min por corrida.
processTestResources {
    exclude 'app/**'
}

gradle.startParameter.continueOnFailure = true
test.finalizedBy('aggregate')
// El informe agregado siempre se regenera (si no, Gradle lo da por al día y queda el de la corrida anterior).
aggregate.outputs.upToDateWhen { false }
