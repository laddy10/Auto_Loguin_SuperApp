############################
# SERENITY CONFIGURATION
############################

serenity.project.name = Login Mi Claro APP
serenity.report.encoding = utf8
serenity.reports.show.step.details = true
serenity.store.html.source = true
serenity.resized.image.width = 600
serenity.compress.screenshots = true
serenity.logging = VERBOSE
serenity.browser.maximized = true
serenity.console.colors = true
# DISABLED: las evidencias (y la captura del paso que falla) las adjunta el propio
# proyecto (utils.ReporteSerenity) con la misma captura de Capturas/. Con FOR_FAILURES
# Serenity tomaba otra captura (y volcaba la pantalla) por cada paso fallido.
serenity.take.screenshots=DISABLED
serenity.outputDirectory=target/site/serenity
serenity.verbose.steps=true
serenity.report.show.manual.tests=true
serenity.compress.filenames=false

############################
# WEBDRIVER CONFIGURATION
############################

webdriver.driver = appium
webdriver.wait.for.timeout = 10000
# Los flujos de login no usan esta espera (utils.Pantalla busca sin espera implicita).
webdriver.timeouts.implicitlywait=10000
serenity.timeout=10000

############################
# APPIUM CONFIGURATION
############################

appium.automationName = UiAutomator2
appium.platformName = Android
appium.orientation = PORTRAIT
appium.newCommandTimeout = 10000
appium.autoGrantPermissions = true
appium.captureScreenshots = true
appium.nativeWebScreenshot = true
appium.unicodeKeyboard = false
appium.resetKeyboard = true
appium.autoDismissAlerts = true
appium.noReset = true
# El orquestador pasa appium.udid y appium.hub del celular asignado.
#appium.udid = A6FS014308000017
#appium.hub=http://127.0.0.1:4734/wd/hub

# App de Mi Claro: se usa la que ya esta instalada en el celular (el orquestador la
# mantiene al dia). appium.app vacio, como en WhatsApp: Serenity exige la clave, pero
# con una ruta Appium procesaba en cada sesion el APK viejo de 250 MB del repo.
appium.app =
appium.appPackage = com.clarocolombia.miclaro
appium.appActivity = com.claro.superapp.SplashActivity

############################
# FEATURES CONFIGURATION
############################

feature.file.language = es
feature.file.encoding = utf8

############################
# PARALLEL EXECUTION
############################

serenity.batch.strategy = DIVIDE_EQUALLY
serenity.batch.count = 2
